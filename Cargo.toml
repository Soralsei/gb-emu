[workspace]
members = ["yargem-lib", "codegen", "common", "yargem"]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[profile.dev.package.yargem-lib]
opt-level = 3
